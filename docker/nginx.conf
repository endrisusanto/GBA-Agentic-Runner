server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://host.docker.internal:3030;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /launcher/ {
    proxy_pass http://host.docker.internal:3031/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
